[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
# The PyPI distribution name. It is NOT "commitguard": that name, and
# "commitguard-cli", belong to two unrelated projects (see docs/adr/009). The
# import package and the console script stay `commitguard`.
name = "commitguardian"
version = "0.1.2"
description = "Block AI, bot and agent attribution in Git commits, locally and on GitHub."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Oluwayemi Oyinlola" }]
keywords = ["git", "security", "provenance", "policy", "git-hooks", "ai-attribution"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0.1",
    # Windows has no system IANA time zone database; zoneinfo needs this package there.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The GitHub App service (webhooks, Checks API). Only RS256 signing of the App
# JWT needs a third-party package; HTTP, WSGI and SQLite use the standard library.
app = [
    "cryptography>=42",
]
dev = [
    "pytest>=8.2",
    # Property-based testing and fuzzing (tests/security). Found two detection
    # bypasses and two ReDoS regressions in Phase 10.
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/oyinlola-tech/commitguard"
Repository = "https://github.com/oyinlola-tech/commitguard"
Documentation = "https://github.com/oyinlola-tech/commitguard/blob/main/docs/README.md"
Changelog = "https://github.com/oyinlola-tech/commitguard/blob/main/CHANGELOG.md"
Issues = "https://github.com/oyinlola-tech/commitguard/issues"

[project.scripts]
commitguard = "commitguard.cli.app:main"

# The sdist is an ALLOWLIST, not "everything git does not ignore". Hatchling's
# default swept in an editor's scratch worktree under .kilo/ (a second copy of
# the repository), the .hypothesis/ test cache and 22 MB of generated benchmark
# datasets - 8.4 MB compressed, and a publishing accident waiting to happen,
# since a published sdist is public and permanent.
[tool.hatch.build.targets.sdist]
# Patterns are gitignore-style, so every one is ANCHORED with a leading slash:
# bare "hooks" or "README.md" also match web/src/hooks/ and any nested README.
include = [
    "/src/commitguard",
    "/rules",
    "/config",
    "/hooks",
    "/tests",
    "/requirements",
    "/docs",
    "/examples",
    "/action.yml",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/CITATION.cff",
]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "/docs/images",       # 1 MB of screenshots; the repository has them
    "/.kilo",             # an editor's scratch worktree: a second copy of the repo
    "/.hypothesis",       # property-test cache
]

[tool.hatch.build.targets.wheel]
packages = ["src/commitguard"]

# Rule data lives in the top-level rules/ directory and ships inside the package.
[tool.hatch.build.targets.wheel.force-include]
"rules" = "commitguard/rules/data"

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "S",       # bandit (security)
    "BLE",     # blind except
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "PT",      # pytest style
    "TID",     # tidy imports
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert and invoke git through subprocess.
"tests/**" = ["S101", "S603", "S607"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["commitguard"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-rfEs", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
markers = [
    "integration: tests that invoke real git or the filesystem beyond tmp_path basics",
    "network: needs internet access (PyPI); run with COMMITGUARD_NETWORK_TESTS=1",
    "phase2: behavioural specification for Phase 2 (AI attribution detection)",
    "phase3: behavioural specification for Phase 3 (Git hook enforcement)",
    "phase5: behavioural specification for Phase 5 (GitHub App)",
    "security: security regression suite (commitguard test security); see tests/conftest.py",
]
