name: Feature or policy request
description: Propose a new detector, policy, rule, integration or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Requests are welcome, but not every request will be implemented. CommitGuard is pre-alpha
        and maintained by one person; scope is kept deliberately small.
        See [ROADMAP.md](https://github.com/oyinlola-tech/commitguard/blob/main/ROADMAP.md) for
        what is already planned. Detection bypasses are security issues: see
        [SECURITY.md](https://github.com/oyinlola-tech/commitguard/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What contribution, provenance or workflow problem does this address? Who has it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: For detection features, separate the detector (what it finds) from the policy (what should happen).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection or rules
        - Policy or configuration
        - Local Git hooks
        - GitHub Action
        - GitHub App
        - Dashboard or API
        - Organization governance
        - Notifications
        - Benchmarks or research
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example commits or configuration
      description: Use example identities and repositories.
      render: text
  - type: textarea
    id: false-positives
    attributes:
      label: False positives and risks
      description: Which legitimate commits or workflows could this affect? Could it weaken enforcement?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: commitguard-version
    attributes:
      label: CommitGuard version you use
      description: Output of `commitguard --version`, if relevant.
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Confidentiality
      options:
        - label: I confirm this issue contains no secrets, tokens, private keys, webhook secrets or private repository content.
          required: true
