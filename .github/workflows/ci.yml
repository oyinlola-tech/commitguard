name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        # Git hooks run under Git's sh on every platform (Git Bash on Windows),
        # so the test shell matches what hooks experience.
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Show Git and shell
        run: |
          git --version
          command -v sh
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest

      - name: Action install and scan (hash-pinned dependencies, needs PyPI)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        env:
          COMMITGUARD_NETWORK_TESTS: "1"
        run: python -m pytest tests/integration/github/test_action_scripts.py

  security-suite:
    name: Security regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Security tests, fuzzing and ReDoS (pytest -m security)
        run: python -m pytest -q -m security
        env:
          COMMITGUARD_EVIDENCE_DIR: evidence-run
      - name: Detection benchmark (a false negative or false positive fails)
        run: commitguard benchmark detection --json --output detection.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: security-evidence
          path: |
            evidence-run/
            detection.json
          if-no-files-found: warn

  platform-validation:
    name: Local enforcement validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Validate hooks, CLI and configuration handling on this platform
        run: commitguard benchmark platform --json --output "platform-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: platform-${{ matrix.os }}
          path: platform-${{ matrix.os }}.json
          if-no-files-found: error

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir dist
      - name: Install the wheel into a clean environment and use it
        run: |
          set -euo pipefail
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install --quiet dist/*.whl
          /tmp/fresh/bin/commitguard --version
          git init --quiet /tmp/demo && cd /tmp/demo
          git config user.email dev@example.com && git config user.name Developer
          /tmp/fresh/bin/commitguard init --install-hooks --non-interactive
          /tmp/fresh/bin/commitguard doctor
          printf 'feat: x\n\nCo-authored-by: Claude <noreply@anthropic.com>\n' > message.txt
          if git commit --allow-empty -F message.txt; then
            echo "the installed package did not block an AI co-authored commit" >&2
            exit 1
          fi
