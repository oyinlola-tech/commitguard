# Release: validate, build once, install and smoke-test everywhere, then draft.
#
# Triggered by a tag `vX.Y.Z` or `vX.Y.ZrcN`. The GitHub release is a DRAFT for
# the maintainer to check and publish; PyPI publishing runs only for a final tag
# (no `rc`) and waits on the `pypi` environment's reviewer.
# See docs/maintainers/release-process.md.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to release (e.g. v0.1.0), or a commit to build as a dry run"
        required: true

permissions:
  contents: read

jobs:
  gate:
    name: Validation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: The tag must match the version in the source
        if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v') }}
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python -c "import commitguard; print(commitguard.__version__)")
          if [ "${TAG#v}" != "${version}" ]; then
            echo "tag ${TAG} does not match commitguard ${version}" >&2
            exit 1
          fi
      - name: Lint and type check
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Full test suite
        run: python -m pytest -q
      - name: Security regression suite
        run: python -m pytest -q -m security
      - name: Benchmark smoke run (detection must be clean)
        run: commitguard benchmark detection
      - name: Reproduce the published evidence
        run: commitguard reproduce benchmark --results benchmarks/results

  build:
    name: Build sdist and wheel
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}   # e.g. 0.1.0, from the built wheel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build
        id: build
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --sdist --wheel --outdir dist
          # Subshell: the cd must not leak into the rest of the step.
          ( cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS )
          # Read the version from the wheel filename. Do NOT `import commitguard`
          # here: this job never installs the package, so the import fails - which
          # is exactly how the v0.1.0 release build broke.
          version="$(python - <<'PY'
          import pathlib, re, sys
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel, found {[w.name for w in wheels]}")
          print(re.fullmatch(r"[^-]+-([^-]+)-.*", wheels[0].name).group(1))
          PY
          )"
          echo "built version ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: The sdist must contain nothing local
        run: |
          set -euo pipefail
          listing="$(tar tzf dist/*.tar.gz)"
          # A published sdist is public and permanent. Hatchling's default once
          # swept in an editor's scratch worktree and 22 MB of generated data.
          for bad in '/\.kilo/' '/\.hypothesis/' '/node_modules/' '/\.venv/' '/\.env' \
                     '/benchmarks/datasets/' '/web/node_modules/' '/\.git/'; do
            if printf '%s\n' "$listing" | grep -qE "$bad"; then
              echo "::error title=sdist::the sdist contains $bad"
              printf '%s\n' "$listing" | grep -E "$bad" | head -20
              exit 1
            fi
          done
          bytes="$(stat -c%s dist/*.tar.gz)"
          echo "sdist: $(printf '%s\n' "$listing" | wc -l) entries, ${bytes} bytes"
          if [ "$bytes" -gt 4000000 ]; then
            echo "::error title=sdist::the sdist is larger than 4 MB; check what was added"
            exit 1
          fi
      - name: Software bill of materials (CycloneDX)
        run: |
          python -m pip install cyclonedx-bom
          python -m cyclonedx_py environment --output-format json --outfile dist/sbom.cdx.json || \
            echo "SBOM generation failed; the draft will say so" >&2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  install:
    name: Install the built wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: distribution
          path: dist
      - name: Verify the checksums
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS
          else shasum -a 256 -c SHA256SUMS; fi
      - name: Install the wheel and smoke-test the CLI
        run: |
          set -euo pipefail
          python -m pip install dist/*.whl
          commitguard --version
          git init --quiet demo && cd demo
          git config user.email dev@example.com && git config user.name Developer
          commitguard init --install-hooks --non-interactive
          commitguard doctor
          git commit --quiet --allow-empty -m "feat: clean commit"
          printf 'feat: x\n\nCo-authored-by: Claude <noreply@anthropic.com>\n' > message.txt
          if git commit --allow-empty -F message.txt; then
            echo "an AI co-authored commit was NOT blocked" >&2
            exit 1
          fi
          commitguard check --message-file message.txt && exit 1 || test $? -eq 1
          commitguard uninstall
      - name: Validate local enforcement on this platform
        run: commitguard benchmark platform --json --output "platform-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: platform-${{ matrix.os }}
          path: platform-${{ matrix.os }}.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The GitHub release. Published automatically for a final tag; a release
  # candidate stays a draft so it is never listed on the Marketplace, which
  # shows whatever tag it was published from.
  # ---------------------------------------------------------------------------
  release:
    name: Publish the GitHub release
    needs: [build, install]
    # A dispatch naming a tag is the supported way to finish a release whose
    # later steps failed the first time, without moving or reusing the tag.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job, only to create the release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts
      - name: Assemble the release notes
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "CommitGuard ${TAG}"
            echo
            echo "Install:"
            echo
            echo '```bash'
            echo "pipx install commitguardian"
            echo '```'
            echo
            echo "The PyPI name is \`commitguardian\`; the command is \`commitguard\`."
            echo "\`commitguard\` and \`commitguard-cli\` on PyPI are unrelated projects."
            echo "To pin to this exact commit instead:"
            echo
            echo '```bash'
            echo "pipx install \"git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_SHA}\""
            echo '```'
            echo
            echo "Verify the artifacts with \`SHA256SUMS\`."
            echo
            echo "Cross-platform validation for this build (commitguard benchmark platform):"
            for file in artifacts/platform-*/platform-*.json; do
              [ -e "$file" ] || continue
              python - "$file" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))["result"]
          print(f"- {d['system']}: {d['passed']} passed, {d['failed']} failed, {d['skipped']} skipped")
          PY
            done
            echo
            echo "See CHANGELOG.md for the changes in this release."
          } > notes.md
          cat notes.md
      # Create or update: a release for this tag may already exist, because
      # listing an Action on the Marketplace REQUIRES a published release, and
      # the natural way to get one is the web form - which creates the tag and
      # the release together, and so triggers this very workflow. Failing here
      # would strand the artifacts and skip the PyPI publish, which is exactly
      # what happened on v0.1.0.
      - name: Create or update the release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${TAG}" == *rc* ]]; then
            flags=(--draft --prerelease)   # never reaches the Marketplace
          else
            flags=(--latest)
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists: attaching artifacts and notes"
            # --clobber so a re-run replaces assets instead of erroring.
            gh release upload "${TAG}" artifacts/distribution/* --clobber
            # Keep a hand-written body: only fill one in if it is empty.
            if [ -z "$(gh release view "${TAG}" --json body --jq .body)" ]; then
              gh release edit "${TAG}" --notes-file notes.md
            else
              echo "keeping the existing release notes"
            fi
          else
            gh release create "${TAG}" "${flags[@]}" \
              --title "CommitGuard ${TAG}" --notes-file notes.md \
              artifacts/distribution/*
          fi
          echo "url=$(gh release view "${TAG}" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      # The one step no workflow can perform: there is no REST or GraphQL API for
      # an Actions Marketplace listing, and `gh release create` has no flag for
      # it. What this does is guarantee the manual click cannot fail, and put the
      # exact link and values one copy away.
      - name: Marketplace listing (manual, by GitHub's design)
        if: ${{ !contains(inputs.ref || github.ref_name, 'rc') }}
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
          RELEASE_URL: ${{ steps.create.outputs.url }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, pathlib, re, sys
          # Top-level keys only (nested ones are indented), so no YAML parser is
          # needed and this cannot break on a runner without PyYAML.
          text = pathlib.Path("action.yml").read_text(encoding="utf-8")
          def top(key):
              match = re.search(rf"^{key}:[ \t]*(.*)$", text, re.M)
              return match.group(1).strip() if match else ""
          problems = [f"action.yml has no `{k}`" for k in ("name", "description", "branding")
                      if not (top(k) or re.search(rf"^{k}:\s*$", text, re.M))]
          name, description = top("name"), top("description")
          if len(description) > 125:
              problems.append(
                  f"action.yml description is {len(description)} characters; "
                  "the Marketplace card truncates past ~125"
              )
          if not pathlib.Path("README.md").exists():
              problems.append("no README.md")
          print("## Publish to the GitHub Marketplace\n")
          if problems:
              print("The listing checkbox will NOT appear until these are fixed:\n")
              for problem in problems:
                  print(f"- {problem}")
              sys.exit(1)
          print(f"1. Open [the release]({os.environ['RELEASE_URL']}) and press **Edit**")
          print("2. Tick **Publish this Action to the GitHub Marketplace**")
          print("3. Primary Category: **Security**, Another Category: **Code review**")
          print("4. Press **Update release**\n")
          print(f"Listing name: `{name}`\n")
          print("> There is no API for this. `gh release create` has no marketplace flag and")
          print("> the release object carries no marketplace field, so no workflow can do it.")
          print("> After the first listing the checkbox stays ticked for later releases.")
          PY

  # ---------------------------------------------------------------------------
  # Publish to PyPI.
  #
  # Trusted Publishing (OIDC): PyPI verifies this workflow's identity directly,
  # so there is no API token to create, store, rotate or leak. `id-token: write`
  # is granted to THIS JOB ONLY, and only after the gate, the build, the
  # cross-platform install smoke test and the GitHub release have succeeded.
  #
  # This is FULLY AUTOMATIC: pushing a final tag publishes to PyPI with no
  # further action. The `pypi` environment must exist in the repository settings
  # (it is named in the Trusted Publisher), but it only pauses for approval if
  # you add a required reviewer to it. Adding one is the way to get a human check
  # before something public and permanent; leaving it empty keeps tag-to-PyPI
  # hands-off.
  #
  # One-time setup on PyPI (Your projects -> Publishing -> Add a pending publisher):
  #   PyPI project name: commitguardian
  #   Owner / repository: this repository
  #   Workflow name:      release.yml
  #   Environment name:   pypi
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [gate, build, install, release]
    if: >-
      ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v'))
          && !contains(inputs.ref || github.ref_name, 'rc') }}
    # Also reachable by re-running this workflow manually on the tag, which is
    # how to finish a release whose PyPI step did not run the first time.
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/commitguardian
    permissions:
      id-token: write  # the OIDC token Trusted Publishing needs; nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: distribution
          path: dist
      - name: Only the sdist and the wheel are published
        run: |
          set -euo pipefail
          # The artifact also carries SHA256SUMS, the SBOM and platform results.
          # Those belong on the GitHub release, not on PyPI.
          find dist -mindepth 1 -maxdepth 1 ! -name '*.whl' ! -name '*.tar.gz' -delete
          ls -l dist
          test -n "$(find dist -name '*.whl')"
          test -n "$(find dist -name '*.tar.gz')"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          print-hash: true
