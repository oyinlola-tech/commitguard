# Release: validate, build once, install and smoke-test everywhere, then draft.
#
# Triggered by a tag `vX.Y.Z` or `vX.Y.ZrcN`. Nothing is published automatically:
# the workflow creates a DRAFT release for the maintainer to check and publish
# (docs/maintainers/release-process.md). CommitGuard is not published to PyPI.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build (a dry run: the draft step is skipped)"
        required: true

permissions:
  contents: read

jobs:
  gate:
    name: Validation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: The tag must match the version in the source
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python -c "import commitguard; print(commitguard.__version__)")
          if [ "${TAG#v}" != "${version}" ]; then
            echo "tag ${TAG} does not match commitguard ${version}" >&2
            exit 1
          fi
      - name: Lint and type check
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Full test suite
        run: python -m pytest -q
      - name: Security regression suite
        run: python -m pytest -q -m security
      - name: Benchmark smoke run (detection must be clean)
        run: commitguard benchmark detection
      - name: Reproduce the published evidence
        run: commitguard reproduce benchmark --results benchmarks/results

  build:
    name: Build sdist and wheel
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build
        id: build
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --sdist --wheel --outdir dist
          cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS
          python -c "import commitguard, os; print(f'version={commitguard.__version__}')" >> "$GITHUB_OUTPUT"
      - name: Software bill of materials (CycloneDX)
        run: |
          python -m pip install cyclonedx-bom
          python -m cyclonedx_py environment --output-format json --outfile dist/sbom.cdx.json || \
            echo "SBOM generation failed; the draft will say so" >&2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  install:
    name: Install the built wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: distribution
          path: dist
      - name: Verify the checksums
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS
          else shasum -a 256 -c SHA256SUMS; fi
      - name: Install the wheel and smoke-test the CLI
        run: |
          set -euo pipefail
          python -m pip install dist/*.whl
          commitguard --version
          git init --quiet demo && cd demo
          git config user.email dev@example.com && git config user.name Developer
          commitguard init --install-hooks --non-interactive
          commitguard doctor
          git commit --quiet --allow-empty -m "feat: clean commit"
          printf 'feat: x\n\nCo-authored-by: Claude <noreply@anthropic.com>\n' > message.txt
          if git commit --allow-empty -F message.txt; then
            echo "an AI co-authored commit was NOT blocked" >&2
            exit 1
          fi
          commitguard check --message-file message.txt && exit 1 || test $? -eq 1
          commitguard uninstall
      - name: Validate local enforcement on this platform
        run: commitguard benchmark platform --json --output "platform-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: platform-${{ matrix.os }}
          path: platform-${{ matrix.os }}.json
          if-no-files-found: error

  draft:
    name: Create the draft release
    needs: [build, install]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job, only to create the draft
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts
      - name: Assemble the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "CommitGuard ${TAG}"
            echo
            echo "**CommitGuard is not published to PyPI.** The name \`commitguard\` there"
            echo "belongs to an unrelated project. Install from this repository, pinned to a commit:"
            echo
            echo '```bash'
            echo "pipx install \"git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_SHA}\""
            echo '```'
            echo
            echo "Verify the artifacts with \`SHA256SUMS\`."
            echo
            echo "Cross-platform validation for this build (commitguard benchmark platform):"
            for file in artifacts/platform-*/platform-*.json; do
              [ -e "$file" ] || continue
              python - "$file" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))["result"]
          print(f"- {d['system']}: {d['passed']} passed, {d['failed']} failed, {d['skipped']} skipped")
          PY
            done
            echo
            echo "See CHANGELOG.md for the changes in this release."
          } > notes.md
          cat notes.md
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --draft \
            --title "CommitGuard ${TAG}" \
            --notes-file notes.md \
            $(if [[ "${TAG}" == *rc* ]]; then echo --prerelease; fi) \
            artifacts/distribution/*
